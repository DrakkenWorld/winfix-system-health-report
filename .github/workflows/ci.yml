name: Windows health report tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/Run-Tests.ps1
